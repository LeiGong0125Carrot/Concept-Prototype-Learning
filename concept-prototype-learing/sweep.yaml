# Hyperparameter Sweep Configuration for Concept Prototype Learning
# 24组参数配置，epoch固定为10

program: train_binary_classification.py
method: grid  # 使用网格搜索确保覆盖所有组合
metric:
  name: eval_f1
  goal: maximize

parameters:
  # === LoRA 参数 ===
  lora_r:
    values: [16, 32, 64]
  lora_alpha:
    values: [32, 64, 128]
  lora_dropout:
    value: 0.1
  
  # === 学习率参数 ===
  learning_rate:
    values: [1e-5, 2e-5, 5e-5]
  lr_scheduler_type:
    values: ["linear", "cosine"]
  warmup_ratio:
    value: 0.1
    
  # === 训练参数 ===
  per_device_train_batch_size:
    value: 5
  gradient_accumulation_steps:
    values: [4, 6, 8]
  num_train_epochs:
    value: 10
    
  # === 正则化 ===
  weight_decay:
    values: [0.01, 0.05]
  
  # === 固定参数 ===
  model_name:
    value: "Simonlee711/Clinical_ModernBERT"
  use_lora:
    value: true
  use_flash_attention:
    value: true
  max_length:
    value: 512
  evaluation_strategy:
    value: "epoch"
  save_strategy:
    value: "epoch"
  load_best_model_at_end:
    value: true
  metric_for_best_model:
    value: "eval_f1"
  greater_is_better:
    value: true
  report_to:
    value: "wandb"
  logging_steps:
    value: 100
  save_total_limit:
    value: 2

# 总共的组合数: 3×3×3×2×3×2 = 324组
# 为了控制在24组，建议手动筛选关键组合或使用bayes方法